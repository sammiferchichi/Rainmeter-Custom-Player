[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,0
Draggable=1
SkinWidth=#SkinWidth#
SkinHeight=#SkinHeight#

ContextTitle=Next Cover
ContextAction=[!UpdateMeasure MeasureNextIndex][!SetVariable DefaultCoverIndex "[*MeasureNextIndex*]"][!WriteKeyValue Variables DefaultCoverIndex "#DefaultCoverIndex#" "#@#Variables.inc"][!UpdateMeasure MeasureDefaultCover][!UpdateMeter MeterCoverPlaceholder][!Redraw]
ContextTitle2=Previous Cover
ContextAction2=[!UpdateMeasure MeasurePrevIndex][!SetVariable DefaultCoverIndex "[*MeasurePrevIndex*]"][!WriteKeyValue Variables DefaultCoverIndex "#DefaultCoverIndex#" "#@#Variables.inc"][!UpdateMeasure MeasureDefaultCover][!UpdateMeter MeterCoverPlaceholder][!Redraw]
ContextTitle3=Random Cover
ContextAction3=[!UpdateMeasure MeasureTimeRand][!UpdateMeasure MeasureRandomIndex][!SetVariable DefaultCoverIndex "[*MeasureRandomIndex*]"][!WriteKeyValue Variables DefaultCoverIndex "#DefaultCoverIndex#" "#@#Variables.inc"][!UpdateMeasure MeasureDefaultCover][!UpdateMeter MeterCoverPlaceholder][!Redraw]
ContextTitle4=Cover Folder
ContextAction4=["#@#DefaultCovers\"]
ContextTitle5=Change The Cover Go to N°: #=...
ContextAction5=[!CommandMeasure MeasureInputCover "ExecuteBatch 1"]
ContextTitle6=Music|Load Folder
ContextAction6=["powershell.exe" "-WindowStyle" "Hidden" "-ExecutionPolicy" "Bypass" "-File" "#@#LoadFolder.ps1"]
ContextTitle7=Cover|Static (no change)
ContextAction7=[!WriteKeyValue Variables CoverStatic "1" "#@#Variables.inc"][!SetVariable CoverStatic "1"][!UpdateMeasure MeasureCoverMode][!UpdateMeter *][!Redraw]
ContextTitle8=Cover|Dynamic (follow music)
ContextAction8=[!WriteKeyValue Variables CoverStatic "0" "#@#Variables.inc"][!SetVariable CoverStatic "0"][!UpdateMeasure MeasureCoverMode][!UpdateMeter *][!Redraw]

[Metadata]
Name=MusicPlayerWidget
Author=Rainmeter User
Version=1.1

[Variables]
@include=#@#Variables.inc

[MeasureWebTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title

[MeasureWebArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist

[MeasureWebAlbum]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Album

[MeasureWebCover]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover

[MeasureWebState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
IfCondition=MeasureState=1
IfTrueAction=[!HideMeter MeterBtnPlayIcon][!ShowMeter MeterBtnPauseIcon][!UpdateMeter *][!Redraw]
IfFalseAction=[!ShowMeter MeterBtnPlayIcon][!HideMeter MeterBtnPauseIcon][!UpdateMeter *][!Redraw]
IfConditionMode=1

[MeasureControl]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State

[MeasureLocalControl]
Measure=Plugin
Plugin=MediaPlayer
PlayerType=State

[MeasureWebProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress

[MeasureWebPosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position

[MeasureDuration]
Measure=Plugin
Plugin=WebNowPlaying

[MeasureWaveCounter]
Measure=Calc
Formula=(MeasureWaveCounter+3)%100
DynamicVariables=1

[MeasureBar1]
Measure=Calc
Formula=(MeasureState=1 ? (3+Sin((MeasureWaveCounter+0)*0.12)*2.5+3) : 1.5)
DynamicVariables=1

[MeasureBar2]
Measure=Calc
Formula=(MeasureState=1 ? (3+Sin((MeasureWaveCounter+18)*0.12)*2.5+3) : 1.5)
DynamicVariables=1

[MeasureBar3]
Measure=Calc
Formula=(MeasureState=1 ? (3+Sin((MeasureWaveCounter+36)*0.12)*2.5+3) : 1.5)
DynamicVariables=1

[MeasureBar4]
Measure=Calc
Formula=(MeasureState=1 ? (3+Sin((MeasureWaveCounter+54)*0.12)*2.5+3) : 1.5)
DynamicVariables=1

[MeasureBar5]
Measure=Calc
Formula=(MeasureState=1 ? (3+Sin((MeasureWaveCounter+72)*0.12)*2.5+3) : 1.5)
DynamicVariables=1

[MeasureBar6]
Measure=Calc
Formula=(MeasureState=1 ? (3+Sin((MeasureWaveCounter+90)*0.12)*2.5+3) : 1.5)
DynamicVariables=1

[MeasureBar7]
Measure=Calc
Formula=(MeasureState=1 ? (3+Sin((MeasureWaveCounter+108)*0.12)*2.5+3) : 1.5)
DynamicVariables=1

[MeasureBar8]
Measure=Calc
Formula=(MeasureState=1 ? (3+Sin((MeasureWaveCounter+126)*0.12)*2.5+3) : 1.5)
DynamicVariables=1

[MeasureWebDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Duration

[MeasureLocalTitle]
Measure=Plugin
Plugin=MediaPlayer
PlayerType=Title

[MeasureLocalArtist]
Measure=Plugin
Plugin=MediaPlayer
PlayerType=Artist

[MeasureLocalAlbum]
Measure=Plugin
Plugin=MediaPlayer
PlayerType=Album

[MeasureLocalCover]
Measure=Plugin
Plugin=MediaPlayer
PlayerType=Cover

[MeasureLocalState]
Measure=Plugin
Plugin=MediaPlayer
PlayerType=State

[MeasureLocalProgress]
Measure=Plugin
Plugin=MediaPlayer
PlayerType=Progress

[MeasureLocalPosition]
Measure=Plugin
Plugin=MediaPlayer
PlayerType=Position

[MeasureLocalDuration]
Measure=Plugin
Plugin=MediaPlayer
PlayerType=Duration

[MeasureTitle]
Measure=Script
ScriptFile=#@#Hybrid.lua
MeasureName1=MeasureLocalTitle
MeasureName2=MeasureWebTitle
DynamicVariables=1


[MeasureArtist]
Measure=Script
ScriptFile=#@#Hybrid.lua
MeasureName1=MeasureLocalArtist
MeasureName2=MeasureWebArtist
DynamicVariables=1

[MeasureAlbum]
Measure=Script
ScriptFile=#@#Hybrid.lua
MeasureName1=MeasureLocalAlbum
MeasureName2=MeasureWebAlbum
DynamicVariables=1

[MeasureCover]
Measure=Script
ScriptFile=#@#Hybrid.lua
MeasureName1=MeasureLocalCover
MeasureName2=MeasureWebCover
DynamicVariables=1

[MeasureState]
Measure=Script
ScriptFile=#@#Hybrid.lua
MeasureName1=MeasureLocalState
MeasureName2=MeasureWebState
DynamicVariables=1
IfCondition=MeasureState=1
IfTrueAction=[!HideMeter MeterBtnPlayIcon][!ShowMeter MeterBtnPauseIcon][!UpdateMeter *][!Redraw]
IfFalseAction=[!ShowMeter MeterBtnPlayIcon][!HideMeter MeterBtnPauseIcon][!UpdateMeter *][!Redraw]
IfConditionMode=1

[MeasureCoverMode]
Measure=Calc
Formula=(#CoverStatic#=1 ? 0 : (MeasureState=1 ? 1 : 0))
DynamicVariables=1
IfCondition=MeasureCoverMode=1
IfTrueAction=[!ShowMeter MeterCoverArt][!HideMeter MeterCoverPlaceholder][!UpdateMeter *][!Redraw]
IfFalseAction=[!HideMeter MeterCoverArt][!ShowMeter MeterCoverPlaceholder][!UpdateMeter *][!Redraw]
IfConditionMode=1

[MeasureProgress]
Measure=Script
ScriptFile=#@#Hybrid.lua
MeasureName1=MeasureLocalProgress
MeasureName2=MeasureWebProgress
DynamicVariables=1

[MeasurePosition]
Measure=Script
ScriptFile=#@#Hybrid.lua
MeasureName1=MeasureLocalPosition
MeasureName2=MeasureWebPosition
DynamicVariables=1

[MeasureDuration]
Measure=Script
ScriptFile=#@#Hybrid.lua
MeasureName1=MeasureLocalDuration
MeasureName2=MeasureWebDuration
DynamicVariables=1

[MeasurePositionFmt]
Measure=String
String=[MeasurePosition]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^(\d+)$":"0:0\1","^(\d+):(\d)$":"\1:0\2"

[MeasureDurationFmt]
Measure=String
String=[MeasureDuration]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^(\d+)$":"0:0\1","^(\d+):(\d)$":"\1:0\2"

[MeasureNextIndex]
Measure=Calc
Formula=(#DefaultCoverIndex#%112)+1
UpdateDivider=-1
DynamicVariables=1

[MeasurePrevIndex]
Measure=Calc
Formula=((#DefaultCoverIndex#-2+82)%82)+1
UpdateDivider=-1
DynamicVariables=1

[MeasureTimeRand]
Measure=Time
Format=%S
UpdateDivider=-1

[MeasureRandomIndex]
Measure=Calc
Formula=((MeasureTimeRand%112)+1)
DynamicVariables=1
UpdateDivider=-1

[MeasureDefaultCover]
Measure=String
String=#@#DefaultCovers\#DefaultCoverIndex#.png
DynamicVariables=1

[MeasureInputCover]
Measure=Plugin
Plugin=InputText
SolidColor=30,30,32,255
FontColor=255,255,255,255
FontFace=Segoe UI
FontSize=10
StringAlign=CenterCenter
X=30
Y=340
W=200
H=22
Command1=[!SetVariable DefaultCoverIndex "$UserInput$"][!WriteKeyValue Variables DefaultCoverIndex "$UserInput$" "#@#Variables.inc"][!UpdateMeasure MeasureDefaultCover][!UpdateMeter MeterCoverPlaceholder][!Redraw]
DefaultValue="#DefaultCoverIndex#"
InputLimit=3
FocusDismiss=1
AntiAlias=1
DynamicVariables=1


[MeterShadow]
Meter=SHAPE
Shape=Rectangle 4,6,(#SkinWidth#-8),(#SkinHeight#-8),(#CardRadius#) | Fill Color 0,0,0,100 | StrokeWidth 0
Hidden=1

[MeterCardBackground]
Meter=SHAPE
Shape=Rectangle (#BorderWidth#/2),(#BorderWidth#/2),(#SkinWidth#-#BorderWidth#),(#SkinHeight#-#BorderWidth#),(#CardRadius#) | Fill Color #CardBgColorTop# | StrokeWidth #BorderWidth# | Stroke Color #BorderColor#,#BorderAlpha#
Hidden=1
DynamicVariables=1

[MeterCoverMask]
Meter=SHAPE
X=(10)
Y=(10)
Shape=Rectangle 0,0,240,240,20 | Fill Color 255,255,255 | StrokeWidth 0

[MeterCoverPlaceholder]
Meter=IMAGE
MeasureName=MeasureDefaultCover
X=0
Y=0
W=240
H=240
PreserveAspectRatio=1
Container=MeterCoverMask
Hidden=1
DynamicVariables=1
UpdateDivider=-1

[MeterCoverArt]
Meter=IMAGE
MeasureName=MeasureCover
X=0
Y=0
W=240
H=240
PreserveAspectRatio=1
Container=MeterCoverMask
DynamicVariables=1




[MeterTitleBg]
Meter=SHAPE
Shape=Rectangle 10,258,240,100,12 | Fill Color 0,0,0,220 | StrokeWidth 1 | Stroke Color 255,255,255,16
DynamicVariables=1

[MeterTitle]
Meter=STRING
MeasureName=MeasureTitle
X=130
Y=282
W=220
H=22
FontFace=Segoe UI
FontSize=11
FontWeight=300
FontColor=255,255,255,255
StringAlign=CenterCenter
AntiAlias=1
ClipString=1
DynamicVariables=1




[MeterArtistAlbum]
Meter=STRING
MeasureName=MeasureArtist
X=130
Y=288
W=220
H=13
FontFace=Segoe UI
FontSize=9
FontWeight=400
FontColor=180,180,185,210
StringAlign=CenterCenter
AntiAlias=1
ClipString=1
DynamicVariables=1

[MeterProgressBarBg]
Meter=SHAPE
Shape=Rectangle 54,303,152,3,1.5 | Fill Color 58,58,60,180 | StrokeWidth 0

[MeterProgressBarFill]
Meter=SHAPE
Shape=Rectangle 54,303,(([MeasureProgress]*152)/100),3,1.5 | Fill Color 235,235,235,255 | StrokeWidth 0
DynamicVariables=1

[MeterTimeElapsed]
Meter=STRING
MeasureName=MeasurePositionFmt
X=26
Y=304
W=36
H=13
StringAlign=LeftCenter
FontFace=Segoe UI
FontSize=8
FontWeight=400
FontColor=200,200,205,210
AntiAlias=1
Text=%1
DynamicVariables=1

[MeterTimeTotal]
Meter=STRING
MeasureName=MeasureDurationFmt
X=237
Y=304
W=36
H=13
StringAlign=RightCenter
FontFace=Segoe UI
FontSize=8
FontWeight=400
FontColor=200,200,205,210
AntiAlias=1
Text=-%1
DynamicVariables=1





[MeterBtnPrev]
Meter=SHAPE
Shape=Path Prev1 | Fill Color 255,255,255,255 | StrokeWidth 0
Prev1=70,328 | LineTo 62,336 | LineTo 70,344 | ClosePath 1
Shape2=Path Prev2 | Fill Color 255,255,255,255 | StrokeWidth 0
Prev2=78,328 | LineTo 70,336 | LineTo 78,344 | ClosePath 1
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureLocalControl "Previous"][!CommandMeasure MeasureControl "Previous"]

[MeterBtnPlayPause]
Meter=SHAPE
Shape=Ellipse 130,328,20 | Fill Color 0,0,0,0 | StrokeWidth 0
Hidden=1

[MeterBtnPlayIcon]
Meter=SHAPE
Shape=Rectangle 122,328,16,16 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PlayPath | Fill Color 255,255,255,255 | StrokeWidth 0
PlayPath=122,328 | LineTo 138,336 | LineTo 122,344 | ClosePath 1
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureLocalControl "PlayPause"][!CommandMeasure MeasureControl "PlayPause"]

[MeterBtnPauseIcon]
Meter=SHAPE
Shape=Rectangle 122,328,16,16 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Rectangle 122,328,5,16 | Fill Color 255,255,255,255 | StrokeWidth 0
Shape3=Rectangle 133,328,5,16 | Fill Color 255,255,255,255 | StrokeWidth 0
Hidden=1
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureLocalControl "PlayPause"][!CommandMeasure MeasureControl "PlayPause"]

[MeterBtnNext]
Meter=SHAPE
Shape=Path Next1 | Fill Color 255,255,255,255 | StrokeWidth 0
Next1=182,328 | LineTo 190,336 | LineTo 182,344 | ClosePath 1
Shape2=Path Next2 | Fill Color 255,255,255,255 | StrokeWidth 0
Next2=190,328 | LineTo 198,336 | LineTo 190,344 | ClosePath 1
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureLocalControl "Next"][!CommandMeasure MeasureControl "Next"]

